name: dox_mailer
description: "Send email from the Dox framework: SMTP, Amazon SES, Azure, Resend, Mailgun, Postmark and sendmail."
version: 3.2.0
repository: https://github.com/dartondox/dox-mailer
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  dox_annotation: ^3.2.0
  dox_queue: ^3.2.0
  dox_view: ^3.2.0
  http: ^1.6.0
  markdown: ^7.3.1

dev_dependencies:
  # only for the tests of queued mail (the app key)
  dox_core: ^3.2.0
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here (`dox mailer:install`).
dox:
  commands: package:dox_mailer/commands.dart

# not real secrets: the TLS key of the fake SMTP server, and the
# example AWS key of the AWS docs for the signature test
false_secrets:
  - /test/fixtures/key.pem
  - /test/sigv4_test.dart
