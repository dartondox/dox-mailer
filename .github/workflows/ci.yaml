name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs these tests on the tag first.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The other Dox packages come from their newest code (main, or the
      # branch with the same name as this PR), not pub.dev. On a tag it
      # does nothing. See the script.
      - run: ci/use-siblings.sh
      # Caches the Rust dependencies of the native packages.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: |
            ../dox-http-native/native -> target
      # Builds the native libraries of the clones, for this machine only.
      - run: ci/use-siblings.sh build
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The other Dox packages come from their newest code (main, or the
      # branch with the same name as this PR), not pub.dev. On a tag it
      # does nothing. See the script.
      - run: ci/use-siblings.sh
      # Caches the Rust dependencies of the native packages.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: |
            ../dox-http-native/native -> target
      # Builds the native libraries of the clones, for this machine only.
      - run: ci/use-siblings.sh build
      - run: dart pub get
      # starts Mailpit, LocalStack and moto (docker-compose.yaml), waits
      # until they are healthy, and runs dart test -t integration
      - run: tool/integration_test.sh
      - name: Server logs
        if: failure()
        run: docker compose logs
